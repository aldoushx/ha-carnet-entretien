<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dégradé pour donner l'effet de relief et de patine du cuir -->
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5c3a21" />
      <stop offset="50%" stop-color="#3d2413" />
      <stop offset="100%" stop-color="#26160a" />
    </linearGradient>
    
    <!-- Ombre portée pour détacher la plaque centrale -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fond global avec coins arrondis (style icône moderne/HACS) -->
  <rect width="512" height="512" rx="110" fill="url(#leatherGrad)" />

  <!-- Liseré / Surpiqûre effet couture vintage -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="#d4af37" stroke-width="4" stroke-dasharray="12, 10" opacity="0.8" />

  <!-- Tranchée centrale simulant la reliure d'un carnet -->
  <line x1="256" y1="40" x2="256" y2="472" stroke="#1a0e05" stroke-width="6" opacity="0.7" />
  <line x1="256" y1="40" x2="256" y2="472" stroke="#d4af37" stroke-width="2" stroke-dasharray="8, 6" opacity="0.4" />

  <!-- Étiquette centrale effet parchemin ou cuir clair -->
  <g filter="url(#shadow)">
    <rect x="80" y="150" width="352" height="212" rx="20" fill="#f4e4bc" stroke="#c89d55" stroke-width="6" />
    <rect x="92" y="162" width="328" height="188" rx="14" fill="none" stroke="#5c3a21" stroke-width="2" opacity="0.3" stroke-dasharray="6, 4" />
  </g>

  <!-- Texte "CARnet" bien gros et centré -->
  <text x="256" y="275" font-family="Georgia, serif" font-size="72" font-weight="bold" fill="#2d1b0d" text-anchor="middle" letter-spacing="4">CAR<tspan fill="#b85d19">net</tspan></text>
  
  <!-- Petit sous-titre discret façon atelier -->
  <text x="256" y="325" font-family="Courier New, monospace" font-size="16" font-weight="bold" fill="#6c584c" text-anchor="middle" letter-spacing="5">GARAGE LOG</text>
</svg>
